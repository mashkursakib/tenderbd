# TenderBD CI: run the Python test suites and build the frontend on
# every push and pull request.
#
# The Postgres-gated tests (backend/tests/test_db_postgres.py and
# tests-scraper/test_db_postgres.py) skip here: they only run when
# TENDERBD_TEST_DATABASE_URL is set. Default run: 146 passed,
# 8 skipped (verified 2026-11-15).

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run backend tests
        run: python -m pytest backend/tests -q

      - name: Run scraper tests
        run: python -m pytest tests-scraper -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Build
        run: cd frontend && npm run build
