<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Bangladesh e-GP tenders, eligibility checks and JV partners." />
    <title>TenderBD</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Nunito+Sans:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Pre-paint theme: apply the stored theme before first paint so
      // there is no flash of the wrong theme. Default is white.
      (function () {
        try {
          var stored = localStorage.getItem('tenderbd_theme');
          var theme = stored === 'dark' || stored === 'device' ? stored : 'light';
          var resolved = theme;
          if (theme === 'device') {
            resolved = window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
          }
          document.documentElement.dataset.theme = resolved;
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
